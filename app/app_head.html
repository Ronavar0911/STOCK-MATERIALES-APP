<title>App Stock de Materiales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style id="css">
/* Layout: control-room board — sticky header with season clock, tab rail; each tab = summary tiles in full rows, charts in a 2-col grid, aligned filter toolbar, dense table; material sheet slides in */
:root{
  --bg:#f3f6f6; --panel:#ffffff; --ink:#14262b; --muted:#5b6f74; --line:#d7e0e1; --soft:#e8eff0;
  --accent:#0d6a73; --accent-ink:#ffffff; --accent-soft:#d6ecee;
  --crit:#b3261e; --crit-soft:#fbe3e1; --crit-bar:#d03b3b;
  --warn:#8f5200; --warn-soft:#fdf0d8; --warn-bar:#ec835a;
  --info:#3b5bab; --info-soft:#e3e9f8; --info-bar:#6d8fd8;
  --ok:#2e7d4f; --ok-soft:#e0f2e7; --ok-bar:#0ca30c;
  --idle:#5f6b6e; --idle-soft:#eceff0; --idle-bar:#b9c3c5;
  --d-reg:#2a78d6; --d-int:#1baf7a; --d-esp:#eda100; --d-pun:#4a3aa7; --d-ina:#8a9396; --d-sin:#c4cbcd;
  --bar:#0d6a73; --bar-soft:#9fd0d4; --grid:#e3eaeb;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --panel:#162124; --ink:#e3ecec; --muted:#93a6aa; --line:#29393c; --soft:#1d2b2e;
  --accent:#4fb3bb; --accent-ink:#06191b; --accent-soft:#183a3e;
  --crit:#ff8a80; --crit-soft:#3d1b19; --crit-bar:#e05a5a; --warn:#f2b45a; --warn-soft:#3a2a10; --warn-bar:#ec835a;
  --info:#9db4f0; --info-soft:#1d2742; --info-bar:#6d8fd8; --ok:#77c897; --ok-soft:#173225; --ok-bar:#2fb34a;
  --idle:#9aa7aa; --idle-soft:#222e31; --idle-bar:#4a5558;
  --d-reg:#3987e5; --d-int:#199e70; --d-esp:#c98500; --d-pun:#9085e9; --d-ina:#6d7a7d; --d-sin:#3d484b;
  --bar:#4fb3bb; --bar-soft:#24585d; --grid:#243235; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --panel:#162124; --ink:#e3ecec; --muted:#93a6aa; --line:#29393c; --soft:#1d2b2e;
  --accent:#4fb3bb; --accent-ink:#06191b; --accent-soft:#183a3e;
  --crit:#ff8a80; --crit-soft:#3d1b19; --crit-bar:#e05a5a; --warn:#f2b45a; --warn-soft:#3a2a10; --warn-bar:#ec835a;
  --info:#9db4f0; --info-soft:#1d2742; --info-bar:#6d8fd8; --ok:#77c897; --ok-soft:#173225; --ok-bar:#2fb34a;
  --idle:#9aa7aa; --idle-soft:#222e31; --idle-bar:#4a5558;
  --d-reg:#3987e5; --d-int:#199e70; --d-esp:#c98500; --d-pun:#9085e9; --d-ina:#6d7a7d; --d-sin:#3d484b;
  --bar:#4fb3bb; --bar-soft:#24585d; --grid:#243235; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1500px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:1.75rem;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
.brand h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.season{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.clock{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.clock b{color:var(--ink);font-weight:500}
.weekbar{width:220px;max-width:50vw;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.weekbar i{display:block;height:100%;background:var(--accent)}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.link{border-color:transparent;background:none;color:var(--accent);padding-inline:6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{font-family:var(--f-display);font-size:1.05rem;font-weight:600;letter-spacing:.02em;border:0;background:none;color:var(--muted);padding:8px 14px 9px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:.72rem;font-weight:500;margin-left:6px;color:var(--muted)}
.status{font-size:.82rem;color:var(--muted);padding:8px 0 0;min-height:1.6em}
.status.err{color:var(--crit)}
section.view{display:flex;flex-direction:column;gap:16px;padding-top:12px}
/* tiles: always full rows */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles.t3>:first-child{grid-column:1/-1}}
@media (max-width:520px){.tiles{grid-template-columns:1fr}.tiles.t3>:first-child{grid-column:auto}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .v{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .l{font-size:.82rem;color:var(--muted);font-weight:500}
.tile .s{font-size:.8rem;color:var(--muted);margin-top:4px}
.tile.hero{border-color:var(--crit);background:linear-gradient(0deg,var(--panel),var(--panel)) padding-box}
.tile.hero .v{color:var(--crit)}
/* cards & charts */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-family:var(--f-display);font-size:1.1rem;font-weight:600;letter-spacing:.02em;margin:0;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card h3 small{font-family:var(--f-body);font-size:.78rem;color:var(--muted);font-weight:500}
.seg{display:flex;height:22px;border-radius:5px;overflow:hidden;gap:2px;background:var(--panel)}
.seg i{display:block;height:100%;min-width:3px;cursor:pointer}
.seg i:hover{filter:brightness(1.1)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.82rem;display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);cursor:pointer}
.chip b{font-variant-numeric:tabular-nums;font-weight:600}
.chip .dot{width:10px;height:10px;border-radius:3px;flex:none}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,.8fr);gap:8px}
@media (max-width:900px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.flow>:last-child{grid-column:1/-1}}
.step{font:inherit;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:2px;position:relative;border-top:4px solid var(--c)}
.step .k{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.step .v{font-family:var(--f-display);font-size:1.8rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.step .l{font-size:.82rem;color:var(--muted)}
.step[aria-pressed="true"]{background:var(--soft);border-color:var(--c)}
.step.aside{border-top-style:dashed}
.hb{display:flex;flex-direction:column;gap:6px}
.hb .r{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.82rem;cursor:default}
.hb .r .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .r .t{height:14px;background:var(--soft);border-radius:0 4px 4px 0;overflow:hidden}
.hb .r .t i{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.hb .r .x{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;min-width:72px}
.hb .r.click{cursor:pointer}.hb .r.click:hover .n{text-decoration:underline}
svg.col{width:100%;height:auto;display:block;overflow:visible}
svg.col text{fill:var(--muted);font-size:10px;font-family:var(--f-mono)}
svg.col .g{stroke:var(--grid);stroke-width:1}
svg.col rect.m{fill:var(--bar)} svg.col rect.m:hover{fill:var(--accent)}
svg.col rect.hit{fill:transparent}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.78rem;padding:6px 9px;border-radius:6px;max-width:280px;line-height:1.35}
/* toolbar */
.toolbar{display:grid;gap:8px;grid-template-columns:minmax(0,2fr) repeat(var(--n,3),minmax(0,1fr)) auto;align-items:center}
@media (max-width:900px){.toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar>input[type=search]{grid-column:1/-1}}
@media (max-width:520px){.toolbar{grid-template-columns:1fr}}
input,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
.note{font-size:.82rem;color:var(--muted);max-width:110ch}
/* table */
.tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--panel);cursor:pointer;user-select:none}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
th[data-dir="asc"]::after{content:" ▲"} th[data-dir="desc"]::after{content:" ▼"}
tbody tr.row{cursor:pointer} tbody tr.row:hover{background:var(--soft)}
tr.sub td{background:var(--soft);padding:4px 12px 12px 48px}
tr.sub table{background:var(--panel);border:1px solid var(--line);border-radius:6px}
tr.sub table{font-size:.8rem} tr.sub th{background:var(--soft);cursor:default}
td.desc{white-space:normal;min-width:200px;max-width:360px}
td.code{font-family:var(--f-mono);font-size:.8rem}
.pill{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--idle-soft);color:var(--idle);white-space:nowrap}
.p-Quiebre{background:var(--crit-soft);color:var(--crit)} .p-Pedir{background:var(--warn-soft);color:var(--warn)}
.p-En{background:var(--info-soft);color:var(--info)} .p-OK{background:var(--ok-soft);color:var(--ok)}
.p-Sobrestock{background:var(--accent-soft);color:var(--accent)}
.s1{background:var(--warn-soft);color:var(--warn)} .s2{background:var(--info-soft);color:var(--info)} .s3{background:var(--accent-soft);color:var(--accent)} .s4{background:var(--ok-soft);color:var(--ok)}
.dem{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;white-space:nowrap}
.dem::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--dc,var(--d-sin))}
.age{font-variant-numeric:tabular-nums;font-weight:600}
.age.a1{color:var(--ok)} .age.a2{color:var(--warn)} .age.a3{color:var(--crit)}
.cov{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.cov i{display:block;width:60px;height:6px;background:var(--soft);border-radius:3px;position:relative;overflow:hidden}
.cov i b{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.more{display:flex;justify-content:center;padding:8px}
.muted{color:var(--muted)}
/* equipos */
.eqlay{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.eqlay{grid-template-columns:1fr}}
.eqlist{display:flex;flex-direction:column;gap:8px;position:sticky;top:130px}
.eqitems{max-height:62vh;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.eqi{font:inherit;color:var(--ink);text-align:left;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.eqi:hover{background:var(--soft)} .eqi[aria-current="true"]{background:var(--accent-soft)}
.eqi .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eqi .c{font-variant-numeric:tabular-nums;font-size:.82rem}
.eqi .sub{font-size:.74rem;color:var(--muted);font-family:var(--f-mono);grid-column:1/-1}
.eqhd h2{font-family:var(--f-display);font-size:1.6rem;margin:0;line-height:1.1}
.seltog{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:7px}
.seltog button{flex:1;font:inherit;font-size:.82rem;border:0;background:none;color:var(--muted);padding:6px;border-radius:5px;cursor:pointer}
.seltog button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
aside.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);z-index:41;border-left:1px solid var(--line);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.sheet h2{font-family:var(--f-display);font-size:1.5rem;margin:0;line-height:1.1;text-wrap:balance}
.sheet h4{font-family:var(--f-display);font-size:1.05rem;letter-spacing:.03em;margin:0 0 6px;color:var(--muted);text-transform:uppercase}
.sheet .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--soft);border-radius:6px;padding:8px 10px}
.fact .v{font-family:var(--f-display);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.fact .l{font-size:.74rem;color:var(--muted)}
.gauge{position:relative;height:28px;background:var(--soft);border-radius:6px;overflow:hidden}
.gauge .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.85}
.gauge .mk{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.gauge-l{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);font-family:var(--f-mono);margin-top:4px;gap:6px;flex-wrap:wrap}
.mini{width:100%;font-size:.8rem}
.mini td,.mini th{padding:5px 6px}
@media (max-width:720px){header.top{position:static}.eqlist{position:static}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.brand h1{font-size:1.4rem}}
@media (prefers-reduced-motion:no-preference){aside.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
<template id="shell">
<header class="top"><div class="top-in">
  <div class="brand">
    <h1><small>PB03 · Mantenimiento Riego · Almacén</small>Stock de Materiales</h1>
    <div class="season">
      <div class="clock"><span>Temporada <b id="tTemp"></b> · semana <b id="tWeek"></b> de 52</span><span class="weekbar"><i id="tBar"></i></span><span id="tSrc"></span></div>
      <button class="btn" id="btnLoad" type="button">Cargar Excel actualizado</button>
      <button class="btn primary" id="btnSave" type="button" hidden>Guardar para el equipo</button>
      <input type="file" id="fileIn" accept=".xlsx,.xlsm" hidden>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="stock" id="tab-stock">Stock vs mínimo<span class="n" id="n-stock"></span></button>
    <button class="tab" role="tab" data-tab="solped" id="tab-solped">Seguimiento SOLPED<span class="n" id="n-solped"></span></button>
    <button class="tab" role="tab" data-tab="mov" id="tab-mov">Consumo y gasto<span class="n" id="n-mov"></span></button>
    <button class="tab" role="tab" data-tab="eq" id="tab-eq">Equipos<span class="n" id="n-eq"></span></button>
    <button class="tab" role="tab" data-tab="res" id="tab-res">Reservas OT<span class="n" id="n-res"></span></button>
  </nav>
</div></header>
<main class="wrap">
  <div class="status" id="status" role="status"></div>
  <section class="view" id="v-stock"></section>
  <section class="view" id="v-solped" hidden></section>
  <section class="view" id="v-mov" hidden></section>
  <section class="view" id="v-eq" hidden></section>
  <section class="view" id="v-res" hidden></section>
</main>
<div id="tip" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden aria-label="Detalle de material"></aside>
</template>
<div id="app"></div>
